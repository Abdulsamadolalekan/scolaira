name: CI (hosted verification, diagnostic — not mergeable)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# H-6 rewrite. What the previous version could not do (measured in
# docs/readiness/H6_SCOPE_MAP.md, G6):
#
#   * there was no database at all — no `services:` entry, no `DATABASE_URL`, no
#     migrations. `npm run build` and `npm test` passed without ever talking to
#     Postgres, so schema drift, RLS regressions and migration failures could not
#     fail the build;
#   * the deploy gate was `wait-on /api/health`, an endpoint that answered
#     `{"status":"ok"}` with the database unreachable, the schema half-applied and
#     the session secret unusable;
#   * only chromium was installed, and the "smoke" suite walked `/preview/*` mock
#     pages, so nothing in CI established a session or touched the product.
#
# This version runs the real thing: a Postgres service, the real provisioning
# script, the real migration runner from zero, the real seed, the real product
# served from a production build over TLS, in two browser engines, gated on
# /api/ready (which fails closed) rather than on liveness.
jobs:
  quality:
    name: Lint, Typecheck, Unit tests, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scolaira_app:scolaira_app_pw@localhost:5432/scolaira_test
      DATABASE_MIGRATION_URL: postgresql://scolaira_owner:scolaira_owner_pw@localhost:5432/scolaira_test
      SCOLAIRA_SESSION_SECRET: ci-session-secret-not-for-production-use-0123456789
      # Reset tokens are echoed by the API only when a non-production deployment
      # opts in (`SCOLAIRA_DEV_ECHO_RESET_TOKEN=1`); the reset-lifecycle suites need
      # that to read the token they just issued. It is set here to match the
      # documented local environment (.env.test) — and it can never take effect in
      # production, where the route's own NODE_ENV guard disables the echo.
      SCOLAIRA_DEV_ECHO_RESET_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision roles and databases
        # The Postgres service is reached over TCP as its superuser (the runner has
        # no local cluster). On a self-hosted machine the runbook equivalent is
        # `sudo -u postgres psql ... -f scripts/bootstrap-roles.sql`.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap-roles.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d scolaira -v boot_db=1 -f scripts/bootstrap-roles.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d scolaira_test -v boot_db=1 -f scripts/bootstrap-roles.sql

      - name: Migrate the test database from zero
        run: npm run db:migrate

      # Scope note (H-6): a repo-wide `prettier --check` is RED on this repository
      # as received — 226 files, including files untouched since M1 (`format:check`
      # fails at the H-4 commit too). Reformatting the whole tree would bury the
      # H-6 change set in unrelated churn, so the gate is scoped to the files this
      # change actually touches. That keeps new code held to the standard without
      # pretending the existing debt is gone; the repo-wide clean-up is a residual
      # item in docs/readiness/H6_RELEASE_EVIDENCE_CLOSEOUT.md.
      - name: Prettier (files changed by this change)
        run: |
          # DIAGNOSTIC ONLY. In the committed workflow this is
          #   RANGE="${{ github.event.pull_request.base.sha }}...HEAD"
          # which resolves to 57 commits / 379 files on this bootstrap PR (base
          # main is still at M1), so it measures the repository's pre-existing
          # formatting debt rather than the change set under test. Here the range
          # is pinned to the change set's parent commit so the SAME check runs
          # against the SAME files the change set actually touched. The committed
          # workflow is left untouched; its real verdict stands separately.
          RANGE="ba451855bec3151f7ad8caf0503fd397ac3aca81...HEAD"
          # Markdown is excluded on purpose: the docs use hand-aligned tables
          # throughout, so prettier's reflow produces churn unrelated to the change.
          FILES=$(git diff --name-only --diff-filter=ACMR "$RANGE" -- '*.ts' '*.tsx' '*.mjs' '*.json' '*.yml' '*.css' | tr '\n' ' ')
          if [ -z "$FILES" ]; then echo "No formattable files changed."; exit 0; fi
          echo "Checking: $FILES"
          npx prettier --check $FILES

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --reporter=default

      - name: Production build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          # DIAGNOSTIC FIX, verified on run 36154690325: upload-artifact@v4
          # defaults `include-hidden-files: false`, and `.next` is a hidden
          # directory, so with `if-no-files-found: error` this step could never
          # pass — the build succeeded and the upload still failed with
          # "No files were found with the provided path: .next". The committed
          # ci.yml still carries the defect; this line is NOT applied there.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Upload unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-evidence
          path: |
            coverage
            vitest-report.json
          retention-days: 7
          if-no-files-found: ignore

  readiness:
    name: Readiness gate (database, schema, auth)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scolaira_app:scolaira_app_pw@localhost:5432/scolaira
      DATABASE_MIGRATION_URL: postgresql://scolaira_owner:scolaira_owner_pw@localhost:5432/scolaira
      SCOLAIRA_SESSION_SECRET: ci-session-secret-not-for-production-use-1234567890
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision roles and databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap-roles.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d scolaira -v boot_db=1 -f scripts/bootstrap-roles.sql

      # The gate is proven to FAIL on an unready deployment first: a database that
      # has never been migrated must be reported `schema_behind`, not `ok`. A gate
      # nobody has seen fail is not evidence.
      - name: Readiness must fail closed on an unmigrated database
        run: |
          npm run build
          npm start &
          npx wait-on http://127.0.0.1:3000/api/health -t 60000
          code=$(curl -s -o /tmp/not-ready.json -w '%{http_code}' http://127.0.0.1:3000/api/ready)
          cat /tmp/not-ready.json
          if [ "$code" != "503" ]; then
            echo "::error::expected /api/ready to be 503 on an unmigrated database, got $code"
            exit 1
          fi
          kill %1 2>/dev/null || true

      - name: Migrate, then require the gate to open
        run: |
          npm run db:migrate
          npm start &
          npx wait-on http://127.0.0.1:3000/api/health -t 60000
          # wait-on resolves on a 2xx: a 503 keeps it waiting, so this step is the
          # gate itself — it only proceeds once readiness actually passes.
          npx wait-on http://127.0.0.1:3000/api/ready -t 60000
          curl -sf http://127.0.0.1:3000/api/ready | tee /tmp/ready.json
          kill %1 2>/dev/null || true

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-evidence
          path: |
            /tmp/ready.json
            /tmp/not-ready.json
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Release gate (seeded database, chromium + webkit)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The E2E database is created, migrated and seeded by `npm run e2e:seed`:
      # a disposable database that never shares state with development.
      E2E_DATABASE_URL: postgresql://scolaira_app:scolaira_app_pw@localhost:5432/scolaira_e2e
      E2E_DATABASE_MIGRATION_URL: postgresql://scolaira_owner:scolaira_owner_pw@localhost:5432/scolaira_e2e
      DATABASE_URL: postgresql://scolaira_app:scolaira_app_pw@localhost:5432/scolaira_e2e
      DATABASE_MIGRATION_URL: postgresql://scolaira_owner:scolaira_owner_pw@localhost:5432/scolaira_e2e
      SCOLAIRA_SESSION_SECRET: ci-session-secret-for-the-e2e-release-gate-0123456789
      # The suite runs the built artifact, exactly as the readiness job does.
      E2E_SERVER_COMMAND: npm start
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit

      - name: Provision roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap-roles.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d scolaira -v boot_db=1 -f scripts/bootstrap-roles.sql

      - name: Build the artifact under test
        run: npm run build

      - name: Seed the release-gate database
        run: npm run e2e:seed

      # Fails the build if the app is not ready (database reachable, migrations at
      # this build's expectation, auth configured) — the deploy gate, not liveness.
      - name: Gate on /api/ready
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000/api/health -t 60000
          npx wait-on http://127.0.0.1:3000/api/ready -t 60000
          mkdir -p artifacts
          curl -sf http://127.0.0.1:3000/api/ready | tee artifacts/ready.json
          # DIAGNOSTIC FIX, verified on run 36155700579: `npm start` spawns
          # `next-server` as a child process, so killing the npm wrapper leaves
          # the child holding port 3000. The next step's Playwright webServer
          # then aborts in CI (reuseExistingServer: !process.env.CI -> false)
          # with "http://127.0.0.1:3000/api/ready is already used". Release the
          # port and wait for it to actually go away before the suite starts.
          # The committed ci.yml still carries the defect; this is NOT applied there.
          kill %1 2>/dev/null || true
          pkill -f 'next-server' 2>/dev/null || true
          for i in $(seq 1 30); do
            if ! curl -s -o /dev/null --max-time 2 http://127.0.0.1:3000/api/health; then
              break
            fi
            sleep 1
          done
          echo "port 3000 released: $(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:3000/api/health)" 

      - name: Release-gate suite (authenticated journeys, both engines)
        run: npx playwright test --grep-invert @design-system

      - name: Design-system suite (dev-only /preview pages)
        run: |
          E2E_SERVER_COMMAND="npm run dev" PLAYWRIGHT_TEST_BASE_URL="http://127.0.0.1:3000" \
            npx playwright test --grep @design-system --project=chromium

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            artifacts
            playwright-report
            test-results
            e2e/.artifacts/seed.json
          retention-days: 14
          if-no-files-found: ignore
